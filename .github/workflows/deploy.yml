name: Build and publish the site

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**', 'tests/**']
  workflow_dispatch:

permissions:
  contents: write   # to save trip.lock.json, so no place is looked up twice
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # a repository variable can point to another trip, like the demo of this repo does
  TRIP_FILE: ${{ vars.TRIP_FILE || 'trip.yaml' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/cache@v6
        with:
          path: .cache
          key: map-data-${{ hashFiles(env.TRIP_FILE) }}
          restore-keys: map-data-

      - name: Build the site
        run: python -m pipeline build "$TRIP_FILE" --out dist

      - name: Save looked-up places
        run: |
          lock="$(dirname "$TRIP_FILE")/trip.lock.json"
          git add "$lock"
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: save looked-up places"
          git push

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the site for Cloudflare
        if: ${{ vars.CLOUDFLARE_PROJECT != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist

  github-pages:
    if: ${{ vars.CLOUDFLARE_PROJECT == '' }}
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # optional: set the CLOUDFLARE_PROJECT variable and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets
  cloudflare-pages:
    if: ${{ vars.CLOUDFLARE_PROJECT != '' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - run: npx wrangler pages deploy dist --project-name "$PROJECT"
        env:
          PROJECT: ${{ vars.CLOUDFLARE_PROJECT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
