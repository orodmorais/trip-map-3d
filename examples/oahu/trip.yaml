stories:
- id: northshore
  title: North Shore
  lat: 21.728
  lon: -158.085
  story:
  - No inverno, tempestades no Pacífico Norte mandam swells que viram ondas gigantes aqui. É o palco mais famoso
    do surf de onda grande.
  - 'Em Waimea acontece a The Eddie, campeonato em homenagem ao salva-vidas e surfista havaiano Eddie Aikau. Ela
    só roda quando as ondas passam de uns 40 pés de face: foram só 11 edições em 41 anos, a última em 22 de dezembro
    de 2024.'
  - Pipeline ganhou o nome em dezembro de 1961. O shaper Mike Diffenderfer achou os tubos parecidos com os canos
    de uma obra na estrada, e o nome pegou no filme de Bruce Brown.
  - 'Haleiwa é a cidadezinha da região: a Rainbow Bridge é de 1921 e o Matsumoto vende shave ice desde 1951.'
  places:
  - puaena
  - rainbow-bridge
  - matsumoto
  - waimea
  - pipeline
  - sunset-beach
  - teds
- id: windward
  title: Lado Windward
  lat: 21.5
  lon: -157.765
  story:
  - É o lado que recebe de frente os ventos alísios de nordeste. Por isso é mais verde e chove mais.
  - 'Os paredões do Ko''olau que aparecem da estrada são a marca de um dos maiores deslizamentos de terra do planeta:
    o Nu''uanu Slide arrancou o lado nordeste do vulcão Ko''olau entre 1 e 1,5 milhão de anos atrás e espalhou pedaços
    da ilha por mais de 200 km no fundo do mar.'
  - Kualoa era terra sagrada na época dos reis havaianos. Hoje o vale Ka'a'awa é o set de cinema mais famoso da
    ilha.
  places:
  - kualoa
  - mokolii
  - byodoin
  - hoomaluhia
  - kjs
  - kailua
  - lanikai
- id: honolulu
  title: Honolulu e Waikiki
  lat: 21.312
  lon: -157.838
  story:
  - 'Até o começo do século 20, cerca de 85% de Waikiki eram área alagada: taro, arroz, tanques de peixe e de patos.'
  - O Canal Ala Wai, cavado entre 1921 e 1928, drenou tudo e abriu espaço para os hotéis que estão lá hoje.
  - Queens leva o nome porque ficava em frente à casa de praia da Rainha Lili'uokalani, a última monarca do Havaí.
  - Diamond Head se chama Lē'ahi em havaiano. O nome em inglês veio de marinheiros britânicos que, em 1825, confundiram
    cristais de calcita com diamantes.
  places:
  - queens
  - waikiki
  - bowls
  - rainbow-drivein
  - diamond
  - hnl
- id: koolau
  title: Montanhas Ko'olau
  lat: 21.47
  lon: -157.905
  story:
  - É o que sobrou do vulcão Ko'olau, o mais novo dos dois que formaram O'ahu.
  - 'A Haiku Stairs sobe essa crista: a escada foi construída em 1942 pela Marinha americana para levar cabos até
    uma estação de rádio.'
  - No Mirante do Pali, em 1795, Kamehameha I venceu a Batalha de Nu'uanu e tomou O'ahu, empurrando os guerreiros
    da ilha pelo penhasco. Foi o passo decisivo para unificar o Havaí.
  places:
  - haiku
  - pali
  - maunawili
  - hoomaluhia
- id: waianae
  title: Montanhas Wai'anae
  lat: 21.47
  lon: -158.165
  story:
  - 'O vulcão mais antigo da ilha: as lavas mais velhas têm cerca de 3,9 milhões de anos e a última erupção foi
    há uns 2,5 milhões.'
  - O Ka'ala, com 1.227 m, é o ponto mais alto de O'ahu. Lá em cima tem um platô pantanoso e uma estação de rastreamento
    da FAA.
  places:
  - kaena
- id: kbay
  title: Baía de Kaneohe
  lat: 21.462
  lon: -157.808
  story:
  - Com 45 km², é a maior área de água abrigada das ilhas principais do Havaí, protegida por uma barreira de recife.
  - A ilhota Moku o Lo'e (Coconut Island) aparece na abertura da série Gilligan's Island. Hoje é um centro de pesquisa
    marinha da Universidade do Havaí.
  - Mokoli'i, o chapéu no canto norte da baía, fica bem em frente ao Kualoa.
  places:
  - mokolii
  - kualoa
  - byodoin
  - kjs
- id: pearl
  title: Pearl Harbor
  lat: 21.343
  lon: -157.99
  story:
  - A base naval atacada pelo Japão em 7 de dezembro de 1941, o que levou os Estados Unidos à Segunda Guerra.
  places:
  - pearl
  - hnl
